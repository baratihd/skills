site_name: مستندات محصول و مهندسی
site_description: مستندات محصول و کسب‌وکار فارسی؛ مرجع فنی و کیفیت انگلیسی
docs_dir: docs
site_dir: _site
repo_url: null
theme:
  name: material
  custom_dir: overrides
  language: fa
  direction: rtl
  features:
  - navigation.sections
  - navigation.indexes
  - search.highlight
  - search.suggest
  - navigation.path
  - navigation.footer
  - toc.follow
  - content.code.copy
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: "سیستم (System)؛ انتخاب روشن"
  - media: "(prefers-color-scheme: light)"
    scheme: default
    toggle:
      icon: material/white-balance-sunny
      name: "روشن (Light)؛ انتخاب تیره"
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      icon: material/moon-waning-crescent
      name: "تیره (Dark)؛ انتخاب سیستم"
  font: false
plugins:
- search:
    lang: en
markdown_extensions:
- admonition
- tables
- attr_list
- md_in_html
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true
- toc:
    permalink: true
hooks:
- hooks.py
extra_css:
- stylesheets/theme.css
- stylesheets/rtl.css
extra:
  documentation_fonts:
    fa:
      label: فونت فارسی
      default: default
      options:
      - id: default
        label: پیش‌فرض — Vazirmatn
        family: '"Vazirmatn", "DejaVu Sans", Tahoma, sans-serif'
        font_names:
        - Vazirmatn
      - id: amiri
        label: Amiri
        family: '"Amiri", "Vazirmatn", serif'
        font_names:
        - Amiri
      - id: b-nazanin
        label: B Nazanin — بی نازنین
        family: '"B Nazanin", "BNazanin", "Vazirmatn", serif'
        font_names:
        - B Nazanin
        - BNazanin
    en:
      label: فونت انگلیسی
      default: default
      options:
      - id: default
        label: Default — Inter
        family: '"Inter", "DejaVu Sans", sans-serif'
        font_names:
        - Inter
      - id: times-new-roman
        label: Times New Roman
        family: '"Times New Roman", Times, "Liberation Serif", serif'
        font_names:
        - Times New Roman
nav:
  - خانه: index.md
  - محصول: product/index.md
  - کسب‌وکار: business/index.md
  - فنی: technical/index.md
  - کیفیت و تست: quality/index.md
  - عملیات: operations/index.md
  - ردیابی: traceability.md
  - پوشش مستندات: coverage.md
  - تغییرات: changes.md
  - واژه‌نامه: glossary.md
